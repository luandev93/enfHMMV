name: Deploy Enfermagem Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-enfermagem-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard main branch deploys
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Deploy permitido apenas na branch main."
            exit 1
          fi

      - name: Authenticate Google Cloud (Service Account)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Firebase env for Vite build
        env:
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY || vars.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN || vars.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID || vars.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ secrets.VITE_FB_STORAGE_BUCKET || vars.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_MESSAGING_SENDER_ID: ${{ secrets.VITE_FB_MESSAGING_SENDER_ID || vars.VITE_FB_MESSAGING_SENDER_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID || vars.VITE_FB_APP_ID }}
        run: |
          for chave in \
            VITE_FB_API_KEY \
            VITE_FB_AUTH_DOMAIN \
            VITE_FB_PROJECT_ID \
            VITE_FB_STORAGE_BUCKET \
            VITE_FB_MESSAGING_SENDER_ID \
            VITE_FB_APP_ID
          do
            if [ -z "${!chave}" ]; then
              echo "Variável obrigatória ausente: $chave"
              exit 1
            fi
          done
          printf '%s\n' \
            "VITE_FB_API_KEY=${VITE_FB_API_KEY}" \
            "VITE_FB_AUTH_DOMAIN=${VITE_FB_AUTH_DOMAIN}" \
            "VITE_FB_PROJECT_ID=${VITE_FB_PROJECT_ID}" \
            "VITE_FB_STORAGE_BUCKET=${VITE_FB_STORAGE_BUCKET}" \
            "VITE_FB_MESSAGING_SENDER_ID=${VITE_FB_MESSAGING_SENDER_ID}" \
            "VITE_FB_APP_ID=${VITE_FB_APP_ID}" \
            > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (enfermagem)
        run: npx --yes firebase-tools@15.26.0 deploy --only hosting:enfermagem --project farmhmmv --non-interactive

      - name: Cleanup temporary env file
        if: always()
        run: rm -f .env.production
